site_name: SSN/SOSA in Vlaanderen
site_description: >-
  Referentiewerk over het modelleren van waarnemingen, herkomst, plannen, grootheden, plaats en
  tijd met SOSA, PROV-O, P-PLAN, QUDT, GeoSPARQL en OWL-Time.
site_url: https://informatievlaanderen.github.io/OSLOthema-SSNSOSA-VL/
repo_url: https://github.com/Informatievlaanderen/OSLOthema-SSNSOSA-VL
repo_name: OSLOthema-SSNSOSA-VL
edit_uri: edit/main/docs/
copyright: Informatie Vlaanderen — OSLO

docs_dir: docs
exclude_docs: |
  /requirements.txt
  /_hooks/

validation:
  nav:
    omitted_files: warn
  links:
    unrecognized_links: warn
    anchors: warn

theme:
  name: material
  language: nl
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Donker thema
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Licht thema
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

hooks:
  - docs/_hooks/kit.py

plugins:
  - search:
      lang: nl

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [".", ".cache"]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

