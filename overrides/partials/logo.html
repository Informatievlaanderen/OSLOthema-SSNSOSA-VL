{#-
  Logo in de kop en in de schuifmenu-kop. Material zet standaard `alt="logo"`;
  hier staat de herkomst van het beeldmerk.
-#}
{% if config.theme.logo %}
  <img src="{{ config.theme.logo | url }}" alt="Vlaamse overheid">
{% else %}
  {% set icon = config.theme.icon.logo or "material/library" %}
  {% include ".icons/" ~ icon ~ ".svg" %}
{% endif %}
